# Production overlay — used on Geekom A9
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Public access is handled by the `cloudflared` service in docker-compose.yml
# (Cloudflare Tunnel + Cloudflare Access). No host-level reverse proxy or TLS
# termination runs on the A9. nginx + certbot were retired on 2026-10-05;
# their legacy configs live under deploy/legacy/ for historical reference.

services:
  api:
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 1G

  web:
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          memory: 1G

  # In production, strip even the 127.0.0.1 host bindings from postgres/redis.
  # They remain reachable on the internal Docker network for `api` / `web`.
  postgres:
    ports: []

  redis:
    ports: []

volumes:
  postgres_data:
  redis_data:
