# Dev overlay — use with: docker compose -f docker-compose.yml -f docker-compose.dev.yml up
version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: dev
    command: ["pnpm", "--filter", "api", "dev"]
    volumes:
      - ./apps/api/src:/app/apps/api/src
      - ./packages:/app/packages
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://alpha:alpha@postgres:5432/alpha
      REDIS_URL: redis://redis:6379
    ports:
      - "3001:3001"
      - "9229:9229"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: dev
    command: ["pnpm", "--filter", "web", "dev"]
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
    environment:
      NODE_ENV: development
      # In dev mode next.config.ts is re-evaluated at startup (not baked),
      # so INTERNAL_API_URL must be a runtime env var here.
      INTERNAL_API_URL: http://api:3001
    ports:
      - "3000:3000"
